<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated shader background with Sula</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
  .hero { position: relative; height: 100vh; display: grid; place-items: center; }
  .hero h1 { position: relative; margin: 0; font-size: clamp(40px, 8vw, 96px); }
</style>
<!-- No build step: the package straight from a CDN -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@studio-treo/sula@1/dist/sula.js"></script>
</head>
<body>
  <section class="hero">
    <!-- The look as a child script, the same JSON as ../look.json -->
    <sula-shader>
      <script type="application/json">
        {
          "v": 1,
          "name": "Example Drift",
          "frag": "#version 300 es\nprecision highp float;\nuniform vec2 u_res;\nuniform float u_time;\nout vec4 fragColor;\n\nvoid main() {\n  vec2 uv = gl_FragCoord.xy / u_res;\n  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);\n  float t = u_time * 0.2;\n  vec2 c = vec2(sin(t), cos(t * 0.7)) * 0.4;\n  float w = sin(p.x * 2.4 + t * 1.3) + sin(p.y * 3.1 - t) + sin(length(p + c) * 5.0 - t * 2.0);\n  w = w / 6.0 + 0.5;\n  vec3 deep = vec3(0.05, 0.03, 0.16);\n  vec3 violet = vec3(0.35, 0.27, 0.91);\n  vec3 rose = vec3(0.98, 0.52, 0.68);\n  vec3 col = mix(deep, violet, smoothstep(0.15, 0.6, w));\n  col = mix(col, rose, smoothstep(0.55, 0.95, w) * uv.y);\n  fragColor = vec4(col, 1.0);\n}\n",
          "settings": { "speed": 1 }
        }
      </script>
    </sula-shader>
    <h1>Hello</h1>
  </section>
</body>
</html>
